# 接口契约 · OpenAPI 3.0（机器可读唯一源）
# owner: /ai-dev-backend（唯一写者）；version / status 与 contract/README.md 保持一致
# 规则：路径 / 方法 / 字段名 / 类型 / 必填 / 分页 / 排序 / 鉴权 / 错误码一律逐字对齐本文件；
#       每个字段须可回溯到 prd/（业务要求）或 dictionary/（1+ 现存接口）或用户明确决策，
#       无来源字段必须标 x-inferred: true 并在 contract/README.md 变更摘要中登记。
openapi: 3.0.3

info:
  title: <项目名称> 接口契约
  version: <v0.1>
  description: status=<draft|frozen|changed>；owner=/ai-dev-backend；技术栈画像 <画像 id>
servers:
  - url: https://<gateway-host>/<base-path>
    description: 占位符；禁止写入真实域名或内网地址

tags:
  - name: <模块名>
    description: 对应 PRD 功能 F01-<功能名>、F02-<功能名>

security:
  - BearerAuth: []

paths:
  /<resources>:
    get:
      tags: [<模块名>]
      operationId: list<Resources>
      summary: <业务用途一句话>
      description: 对应 F01-<功能名>；AC 摘要：<AC 描述>
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，默认 1
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          description: 每页条数，默认 20，上限 100
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: <筛选字段>
          in: query
          required: false
          description: <筛选口径与匹配方式（精确 / 模糊）>
          schema: { type: string, maxLength: 64 }
        - name: sortBy
          in: query
          required: false
          description: 排序字段，默认 createdAt
          schema: { type: string, enum: [createdAt, updatedAt], default: createdAt }
        - name: order
          in: query
          required: false
          description: 排序方向，默认 desc
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePage<Resource>' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [<模块名>]
      operationId: create<Resource>
      summary: <业务用途一句话>
      description: 对应 F02-<功能名>；写操作须幂等或事务保护，控制方式在 impl-report.md 说明
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/<Resource>CreateDTO' }
      responses:
        '200':
          description: 创建成功，data 为新建对象主键
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /<resources>/{id}:
    get:
      tags: [<模块名>]
      operationId: get<Resource>
      summary: 查询单个对象
      parameters:
        - name: id
          in: path
          required: true
          description: 主键
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse<Resource>VO' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [<模块名>]
      operationId: update<Resource>
      summary: <业务用途一句话>
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/<Resource>UpdateDTO' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [<模块名>]
      operationId: delete<Resource>
      summary: 删除对象（逻辑删除时在 data-model.md 说明 status 取值）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseVoid' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 参数校验失败（错误码见 error-codes.md）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseVoid' }
    Unauthorized:
      description: 未登录或令牌失效（错误码见 error-codes.md）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseVoid' }
    Forbidden:
      description: 无权限（错误码见 error-codes.md）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseVoid' }
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseVoid' }
    Conflict:
      description: 唯一约束或状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseVoid' }

  schemas:
    ApiResponseVoid:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: 业务码，0 或 200 表示成功，见 error-codes.md }
        message: { type: string, description: 展示用文案，成功时为 "success" }
        data: { nullable: true, description: 无数据时为 null }
        traceId: { type: string, description: 链路标识，便于排障 }
    ApiResponseLong:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data: { type: integer, format: int64 }
    ApiResponsePage<Resource>:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              type: object
              required: [total, page, pageSize, list]
              properties:
                total: { type: integer, format: int64, description: 总条数 }
                page: { type: integer, description: 当前页 }
                pageSize: { type: integer, description: 每页条数 }
                list:
                  type: array
                  items: { $ref: '#/components/schemas/<Resource>VO' }
    ApiResponse<Resource>VO:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/<Resource>VO' }
    <Resource>VO:
      type: object
      description: 对外展示对象；禁止直接暴露持久化实体
      required: [id]
      properties:
        id: { type: integer, format: int64, description: 主键 }
        <字段名>: { type: string, maxLength: 64, description: <业务含义>；枚举见 enums.md }
        status: { type: integer, description: <状态字段，取值见 enums.md / data-model.md> }
        createdAt: { type: string, format: date-time, description: 创建时间 }
        updatedAt: { type: string, format: date-time, description: 更新时间 }
    <Resource>CreateDTO:
      type: object
      required: [<必填字段名>]
      properties:
        <必填字段名>: { type: string, maxLength: 64, description: <校验规则：非空 / 长度 / 格式> }
        <可选字段名>: { type: string, maxLength: 255, description: <业务含义> }
        idempotentKey: { type: string, maxLength: 64, description: 幂等键；由前端生成，服务端去重 }
    <Resource>UpdateDTO:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        <字段名>: { type: string, maxLength: 64, description: <业务含义> }
        version: { type: integer, description: 乐观锁版本号，冲突返回见 error-codes.md }
